#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "jitsi"
name = "Jitsi Meet"
description.en = "Video conferencing web application"
description.fr = "Application web de conférence vidéo"

version = "2.0.11248~ynh1"

maintainers = []

[upstream]
license = "Apache-2.0"
website = "https://jitsi.org/"
demo = "https://meet.jit.si/"
userdoc = "https://jitsi.org/user-faq/"
code = "https://github.com/jitsi/jitsi-meet"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = "all"
multi_instance = false

ldap = true
sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources]
    [resources.sources.jitsi-meet-web]
    url = "https://download.jitsi.org/stable/stable/jitsi-meet-web_1.0.9644-1_all.deb"
    sha256 = "9f6a2d486922a386cca16e2a5e6a74e9ca95a575488d9ea8d462f3cc4b15e603"
    format = "whatever"
    extract = false
    rename = "jitsi-meet-web.deb"

    [resources.sources.jitsi-sctp]
    url = "https://github.com/sctplab/usrsctp/archive/c625e21950600460cb5c6075616eb1622df2b06a.zip"
    sha256 = "e69793c4e68f5cbd15deef9f22c8027da2fb384c7ee76f096007b2f7e0ff0c05"

    [resources.sources.jitsi-jicofo]
    url = "https://download.jitsi.org/stable/stable/jicofo_1.0-1233-1_all.deb"
    sha256 = "fed5b3cc175c55ad460bf8c33e6c01e21f4a3c3b6788cc43610cfc004c9bd7e4"
    format = "whatever"
    extract = false
    rename = "jitsi-jicofo.deb"

    [resources.sources.jitsi-videobridge]
    url = "https://download.jitsi.org/stable/stable/jitsi-videobridge2_2.3-358-gf8efaa72c-1_all.deb"
    sha256 = "cb69e8a1f582284f9d57951cc0f336e0e2ab1a0b4f396b6ed8b3576bea41c38c"
    format = "whatever"
    extract = false
    rename = "jitsi-videobridge.deb"

    [resources.sources.usrsctp]
    url = "https://github.com/sctplab/usrsctp/archive/c625e21950600460cb5c6075616eb1622df2b06a.zip"
    sha256 = "e69793c4e68f5cbd15deef9f22c8027da2fb384c7ee76f096007b2f7e0ff0c05"

    [resources.sources.jitsi-meet-prosody]
    url = "https://download.jitsi.org/stable/stable/jitsi-meet-prosody_1.0.9644-1_all.deb"
    sha256 = "7306cb96de0679aeb6ca3d7eecca2949a79a98bee13049536c94716b07d4c221"
    format = "whatever"
    extract = false
    rename = "jitsi-meet-prosody.deb"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 4443
    main.exposed = "TCP"
    videobridge.default = 10000
    videobridge.exposed = "UDP"
    component.default = 5347
    jvb.default = 9090
    jicofo.default = 8888

    [resources.apt]
    packages = [
        "openjdk-8-jre-headless\\|openjdk-11-jre-headless\\|openjdk-17-jre-headless\\|openjdk-21-jre-headless",
        "debconf",
        "procps",
        "uuid-runtime",
        "lua-ldap",
        "prosody",
        "binutils",
    ]

    packages_from_raw_bash = """
        if [[ "$YNH_ARCH" == "armhf" ]] || [[ "$YNH_ARCH" == "arm64" ]]; then
           echo automake autoconf build-essential libtool git maven m4
        fi
    """
